<div style="width: 1440px; height: 960px; box-sizing: border-box; background: #EDEDEA; color: #111110; font-family: 'Onest', sans-serif; padding: 24px 48px 40px; display: flex; flex-direction: column">

<button type="button" style="display: inline-flex; align-items: center; gap: 8px; height: 48px; padding: 0 18px; flex-shrink: 0; border-radius: 999px; border: none; background: #FFFFFF; font-family: 'Onest', sans-serif; font-size: 15px; font-weight: 600; color: #111110; box-shadow: 0 1px 2px rgba(17,17,16,0.06)">

<span style="display: inline-flex; align-items: center; gap: 10px"><span style="height: 44px; min-width: 44px; padding: 0 12px; box-sizing: border-box; border-radius: 13px; background: linear-gradient(180deg, #FFFFFF 0%, #F4F4F1 100%); box-shadow: inset 0 -3px 0 rgba(17,17,16,0.07), 0 0 0 1px rgba(17,17,16,0.07), 0 8px 14px -10px rgba(17,17,16,0.5); display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700">a</span><span style="font-size: 15px; color: #3F3F3C">новая вещь</span></span>

<span style="display: inline-flex; align-items: center; gap: 10px"><span style="height: 44px; min-width: 44px; padding: 0 12px; box-sizing: border-box; border-radius: 13px; background: linear-gradient(180deg, #FF6A33 0%, {{accent}} 100%); box-shadow: inset 0 -3px 0 rgba(120,30,0,0.28), 0 8px 14px -10px rgba(200,60,10,0.8); color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700">the</span><span style="font-size: 15px; color: #3F3F3C">уже знакомая</span></span>

<div style="display: flex; align-items: center; gap: 10px">

<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111110" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H3v6h3l5 4z"></path><path d="M15.5 8.5a5 5 0 0 1 0 7"></path></svg></button>
</div>
<span style="padding-left: 6px; font-size: 14px; color: #5E5E5A">Класс! А какого она цвета?</span>
</div>
</div>

<span style="align-self: center; display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px; border-radius: 999px; background: #FFEDE4; color: #7A2A08; font-size: 15px">Ответь: «Ручка синяя» · <span lang="en" style="font-weight: 600">blue</span> — синий</span>

<textarea id="d-answer" rows="1" style="flex-grow: 1; height: 40px; padding: 8px 0 0; border: none; outline: none; background: transparent; font-family: 'Onest', sans-serif; font-size: 22px; color: #111110; resize: none">The pen is blue.</textarea>

<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#111110" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg></button>
<button type="button" style="height: 52px; padding: 0 26px; flex-shrink: 0; border-radius: 999px; border: none; background: #111110; color: #FFFFFF; font-family: 'Onest', sans-serif; font-size: 16px; font-weight: 600">Проверить</button>
</div>
</div>
</article>
<div style="display: flex; justify-content: space-between; align-items: center; padding: 0 8px">

<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111110" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"></path></svg>Подсказка</button>

<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FF5A1F","options":["#FF5A1F","#2E5BFF","#12A150","#111110"]},"$preview":{"width":1440,"height":960}}'>

renderVals() {
return { accent: this.props.accent ?? '#FF5A1F' };
}
}
